services:
  recordviewer:
    build: .
    image: recordviewer:latest
    container_name: recordviewer
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      RV_LOG_LEVEL: INFO
    ports:
      - "8765:8765"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${RECORDINGS_PATH:-./recordings}:/recordings:ro
    # Uncomment for VAAPI / Quick Sync hardware transcoding (set FFmpeg > Hardware acceleration in the UI)
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID:-105}"
